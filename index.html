<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./logo.svg" />
    <link rel="mask-icon" sizes="any" href="logo.svg" />
    <title>Sigil Generator</title>
  </head>
  <body>
    <main>
      <h1>Sigil Generator</h1>
      <form class="form" id="wish-form">
        <label for="wish"
          >Type your wish or desire and hit enter. Only letters are allowed, no
          numbers or special characters. Keep it concise and don't use
          negatives.
        </label>
        <input
          class="input"
          type="text"
          name="wish"
          id="wish"
          pattern="[ A-Za-z]*"
          title="Only letters and spaces are allowed, and at least one letter is required."
          required
        />
        <div class="buttons">
          <button type="submit" disabled>enter</button>
          <button type="reset">reset</button>
        </div>
      </form>
      <fieldset class="variations">
        <legend>Animation</legend>
        <label><input type="radio" name="variation" value="random" checked /><span>random</span></label>
        <label><input type="radio" name="variation" value="metamorphosis" /><span>metamorphosis</span></label>
        <label><input type="radio" name="variation" value="wheel" /><span>wheel</span></label>
        <label><input type="radio" name="variation" value="colony" /><span>colony</span></label>
        <label><input type="radio" name="variation" value="thread" /><span>thread</span></label>
        <label><input type="radio" name="variation" value="classic" /><span>classic</span></label>
      </fieldset>
      <p class="now-playing" aria-live="polite"></p>
      <section class="result">
        <svg width="482" height="482" viewBox="0 0 482 482" id="svg"></svg>
      </section>
    </main>
    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
